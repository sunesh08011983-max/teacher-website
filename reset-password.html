<body>

  <div class="box">

    <h1>Reset Password</h1>

    <p class="subtitle">
      Set a new password for your account.
    </p>

    <div id="formArea">

      <input
        type="password"
        id="newPassword"
        placeholder="New password"
        minlength="6"
        autocomplete="new-password"
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        minlength="6"
        autocomplete="new-password"
      >

      <button id="resetBtn">
        Update Password
      </button>

    </div>

    <p id="message"></p>

  </div>


  <script>

    const SUPABASE_URL =
      "https://ifehzphaiekcaplckjfl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_8RwWggD47qMdZfveDF4DIg_Ql29_OoJ";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const resetBtn =
      document.getElementById("resetBtn");

    const message =
      document.getElementById("message");

    const formArea =
      document.getElementById("formArea");


    function showMessage(text, color = "#111827") {

      message.textContent = text;
      message.style.color = color;

    }


    // Detect Supabase password recovery session
    db.auth.onAuthStateChange(async (event, session) => {

      console.log("Auth event:", event);

      if (event === "PASSWORD_RECOVERY") {

        if (session) {

          formArea.classList.remove("hidden");

          showMessage(
            "Recovery link verified. Enter your new password.",
            "green"
          );

        } else {

          formArea.classList.add("hidden");

          showMessage(
            "This recovery link is invalid or expired.",
            "red"
          );

        }

      }

    });


    // Check whether a session already exists
    async function checkSession() {

      const {
        data: { session }
      } = await db.auth.getSession();

      if (!session) {

        formArea.classList.add("hidden");

        showMessage(
          "Please open the password recovery link from your email.",
          "red"
        );

      }

    }


    checkSession();


    resetBtn.addEventListener("click", async () => {

      const newPassword =
        document.getElementById("newPassword").value.trim();

      const confirmPassword =
        document.getElementById("confirmPassword").value.trim();


      if (newPassword.length < 6) {

        showMessage(
          "Password must be at least 6 characters.",
          "red"
        );

        return;

      }


      if (newPassword !== confirmPassword) {

        showMessage(
          "Passwords do not match.",
          "red"
        );

        return;

      }


      resetBtn.disabled = true;

      showMessage(
        "Updating password..."
      );


      const { error } =
        await db.auth.updateUser({
          password: newPassword
        });


      if (error) {

        console.error(
          "Password update error:",
          error
        );

        showMessage(
          "Password update failed: " + error.message,
          "red"
        );

        resetBtn.disabled = false;

        return;

      }


      showMessage(
        "Password updated successfully! Redirecting...",
        "green"
      );


      // Sign out after successful password change
      await db.auth.signOut();


      setTimeout(() => {

        window.location.href = "login.html";

      }, 2000);

    });

  </script>
