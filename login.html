<body>

  <div class="login-box">

    <h1>Takshashila Vidhyapeeth</h1>

    <h2>Secure Login</h2>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" class="login-button">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-link">
      ← Back to Website
    </a>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
      IMPORTANT:
      Replace ONLY these two values with your own
      Supabase Project URL and Publishable Key.

      NEVER put your Secret / Service Role key here.
    */

    const SUPABASE_URL = "https://ifehzphaiekcaplckjfl.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_8RwWggD47qMdZfveDF4DIg_Ql29_OoJ";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        message.textContent = "Logging in...";
        message.style.color = "#555";


        const { data, error } =
          await db.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.textContent =
            "Login failed. Please check your email and password.";

          message.style.color = "red";

          return;
        }


        const user = data.user;


        const { data: profile, error: profileError } =
          await db
            .from("profiles")
            .select("role, full_name")
            .eq("id", user.id)
            .single();


        if (profileError || !profile) {

          message.textContent =
            "Your account profile is not configured.";

          message.style.color = "red";

          await db.auth.signOut();

          return;
        }


        if (profile.role === "admin") {

          window.location.href = "admin.html";

        }

        else if (profile.role === "student") {

          window.location.href = "student.html";

        }

        else {

          message.textContent =
            "Invalid account role.";

          message.style.color = "red";

          await db.auth.signOut();

        }

      });

  </script>
