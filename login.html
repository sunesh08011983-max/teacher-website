  <style>

      text-decoration: underline;

      display: block;

      margin-top: 18px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Login</h1>

    <p class="subtitle">
      Takshashila Vidhyapeeth
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button id="loginBtn">
      Login
    </button>

    <a class="forgot" id="forgotBtn">
      Forgot Password?
    </a>

    <p id="message"></p>

    <a class="back" href="index.html">
      ← Back to Website
    </a>

  </div>


  <script>

    const SUPABASE_URL =
      "https://ifehzphaiekcaplckjfl.supabase.co";


    /*
      IMPORTANT:
      Replace YOUR_PUBLISHABLE_KEY with your
      Supabase Publishable → Default key.
    */

    const SUPABASE_KEY =
      "sb_publishable_8RwWggD47qMdZfveDF4DIg_Ql29_OoJ";


    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const loginBtn =
      document.getElementById("loginBtn");

    const forgotBtn =
      document.getElementById("forgotBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, color = "#111827") {

      message.textContent = text;
      message.style.color = color;

    }


    // =========================
    // NORMAL LOGIN
    // =========================

    loginBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "red"
        );

        return;

      }


      loginBtn.disabled = true;

      showMessage("Logging in...");


      const {
        data,
        error
      } = await db.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        showMessage(
          "Supabase Error: " + error.message,
          "red"
        );

        loginBtn.disabled = false;

        return;

      }


      if (!data || !data.user) {

        showMessage(
          "Login failed: user information not found.",
          "red"
        );

        loginBtn.disabled = false;

        return;

      }


      const user = data.user;


      // =========================
      // GET USER PROFILE
      // =========================

      showMessage("Checking account profile...");


      const {
        data: profile,
        error: profileError
      } = await db

        .from("profiles")

        .select("role, full_name")

        .eq("id", user.id)

        .single();


      if (profileError) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );

        showMessage(
          "Profile Error: " +
          profileError.message +
          " | Code: " +
          (profileError.code || "unknown"),
          "red"
        );

        await db.auth.signOut();

        loginBtn.disabled = false;

        return;

      }


      if (!profile) {

        showMessage(
          "No profile found for this account.",
          "red"
        );

        await db.auth.signOut();

        loginBtn.disabled = false;

        return;

      }


      // =========================
      // ADMIN
      // =========================

      if (profile.role === "admin") {

        window.location.href = "admin.html";

        return;

      }


      // =========================
      // STUDENT
      // =========================

      if (profile.role === "student") {

        window.location.href = "student.html";

        return;

      }


      // =========================
      // UNKNOWN ROLE
      // =========================

      showMessage(
        "Account profile found, but the role is not configured.",
        "red"
      );


      await db.auth.signOut();

      loginBtn.disabled = false;

    });


    // =========================
    // FORGOT PASSWORD
    // =========================

    forgotBtn.addEventListener("click", async () => {

      const email =
        document.getElementById("email").value.trim();


      if (!email) {

        showMessage(
          "Enter your email address first.",
          "red"
        );

        return;

      }


      forgotBtn.style.pointerEvents = "none";

      showMessage(
        "Sending password reset email..."
      );


      const {
        error
      } = await db.auth.resetPasswordForEmail(

        email,

        {
          redirectTo:
            "https://sunesh08011983-max.github.io/teacher-website/reset-password.html"
        }

      );


      if (error) {

        console.error(
          "PASSWORD RESET ERROR:",
          error
        );

        showMessage(
          "Password reset error: " +
          error.message,
          "red"
        );

        forgotBtn.style.pointerEvents = "auto";

        return;

      }


      showMessage(
        "Password reset email sent. Check your inbox.",
        "green"
      );


      /*
        Do not repeatedly click Forgot Password.
        Supabase applies rate limits to recovery emails.
      */

      setTimeout(() => {

        forgotBtn.style.pointerEvents = "auto";

      }, 60000);

    });

  </script>

</body>

</html>
