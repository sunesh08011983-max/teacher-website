      font-size: 14px;

      display: inline-block;
      margin-top: 22px;
      color: #3b2a1d;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Takshashila Vidhyapeeth</h1>

    <h2>Secure Login</h2>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit" class="login-button">
        Login
      </button>

    </form>

    <a href="#" id="forgotPassword" class="forgot-link">
      Forgot Password?
    </a>

    <div id="message"></div>

    <a href="index.html" class="back-link">
      ← Back to Website
    </a>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://ifehzphaiekcaplckjfl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_8RwWggD47qMdZfveDF4DIg_Ql29_OoJ";


    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const message =
      document.getElementById("message");


    /* =========================
       NORMAL LOGIN
       ========================= */

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        message.textContent =
          "Logging in...";

        message.style.color =
          "#555";


        const { data, error } =
          await db.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.textContent =
            "Supabase Error: " + error.message;

          message.style.color =
            "red";

          console.error(
            "Login error:",
            error
          );

          return;
        }


        const user =
          data.user;


        /* =========================
           CHECK USER PROFILE
           ========================= */

        const {
          data: profile,
          error: profileError
        } =
          await db
            .from("profiles")
            .select("role, full_name")
            .eq("id", user.id)
            .single();


        if (
          profileError ||
          !profile
        ) {

          message.textContent =
            "Your account profile is not configured.";

          message.style.color =
            "red";


          await db.auth.signOut();

          return;
        }


        /* =========================
           ROLE REDIRECT
           ========================= */

        if (
          profile.role === "admin"
        ) {

          window.location.href =
            "admin.html";

        }

        else if (
          profile.role === "student"
        ) {

          window.location.href =
            "student.html";

        }

        else {

          message.textContent =
            "Invalid account role.";

          message.style.color =
            "red";


          await db.auth.signOut();
        }

      });


    /* =========================
       FORGOT PASSWORD
       ========================= */

    document
      .getElementById("forgotPassword")
      .addEventListener("click", async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

          message.textContent =
            "Please enter your email address first.";

          message.style.color =
            "red";

          return;
        }


        message.textContent =
          "Sending password reset email...";

        message.style.color =
          "#555";


        const { error } =
          await db.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://sunesh08011983-max.github.io/teacher-website/reset-password.html"
            }
          );


        if (error) {

          message.textContent =
            "Reset failed: " +
            error.message;

          message.style.color =
            "red";

          console.error(
            "Password reset error:",
            error
          );

          return;
        }


        message.textContent =
          "Password reset email sent. Please check your inbox.";

        message.style.color =
          "green";

      });

  </script>

</body>
</html>
